server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ส่ง /api ต่อให้ BE container (ชื่อ service "api" ใน docker-compose)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # BE อ่าน X-Forwarded-For แค่ hop เดียว (ForwardLimit = 1): ใส่ IP จริงแทนการต่อท้าย ผู้ใช้จึงปลอม IP ไม่ได้
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ไฟล์จาก vite build มี hash ในชื่อ cache ได้นาน
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: path ที่ไม่ใช่ไฟล์ (เช่น /verify-email) ให้ index.html จัดการ
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
